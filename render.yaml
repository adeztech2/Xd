services:
  - type: web
    name: adez-md
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: SESSION_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: MODE
        value: public
      - key: PREFIX
        value: .
      - key: TIMEZONE
        value: Africa/Nairobi
